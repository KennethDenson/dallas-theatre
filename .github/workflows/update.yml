name: Update calendar

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours, off the hour
  workflow_dispatch:
    inputs:
      force:
        description: Re-extract even if the page hasn't changed
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [app.py, .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  CLAUDE_VERSION: "2.1.304"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build feeds
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
          TZ: America/Chicago
          FORCE: ${{ inputs.force }}
        run: python -u app.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Listings updated $(date +%F)"
          elif [ "$(git log -1 --format=%ct)" -lt "$(date -d '45 days ago' +%s)" ]; then
            # GitHub pauses scheduled workflows after 60 days without repo activity
            git commit -q --allow-empty -m "Keepalive $(date +%F)"
          fi
          git push -q

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
